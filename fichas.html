<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Fichas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/fichas.css">
    <script src="js/fichas.js" defer></script>
</head>
<body>
    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="campanha.html">Campanhas</a></li>
            <li><a href="fichas.html">Fichas</a></li>
            <li><a href="#" aria-disabled="true" title="Em breve">Nosso RPG</a></li>
        </ul>
        <div class="perfil">
            <a href="login.html">
                <img src="caminho/para/foto.jpg" alt="Foto do Perfil" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="bi bi-person-circle"></i>
            </a>
        </div>
    </nav>
    <header class="pagina-titulo">
        <h1>Fichas de Criaturas</h1>
        <p>Encontre criaturas e entidades para suas campanhas.</p>
    </header>
    <main class="container">
        <div id="catalog">
            <div class="filters">
                <input type="search" id="search" class="search" placeholder="Pesquisar criatura...">
                <div class="filter-buttons">
                    <button class="active" data-filter="todos">Todas</button>
                    <button data-filter="real">Mundo Real</button>
                    <button data-filter="arcana">Arcana</button>
                </div>
            </div>
            </div>
        </div>
        <div id="detail" class="hidden">
            <a href="fichas.html" class="back-button">← Voltar às criaturas</a>
            <div class="banner">
                Para utilizar a ficha em jogo, vá até a página da campanha, crie um combate e adicione a ficha.
            </div>
            <div class="sheet">
                <div class="sheet-title">
                    </h2>
                    </p>
                </div>
                <div class="hp-bar">
                    <button id="hpDown" type="button">−</button>
                    <span id="hpValue"></span>
                    <button id="hpUp" type="button">+</button>
                </div>
                <div class="tabs">
                    <button class="active" data-tab="status">STATUS</button>
                    <button data-tab="combate">COMBATE</button>
                    <button data-tab="descricao">DESCRIÇÃO</button>
                </div>
                <section id="status" class="section active"></section>
                <section id="combate" class="section"></section>
                <section id="descricao" class="section"></section>
            </div>
        </div>
    </main>
</body>
</html>
