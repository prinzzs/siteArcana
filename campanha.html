<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcana | Campanhas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/structure.css">
  <link rel="stylesheet" href="css/campanha.css">
    <link rel="stylesheet" href="css/visual.css">
  <script src="js/auth.js" defer></script>
  <script src="js/campanhas.js" defer></script>
</head>
<body>
  <nav aria-label="Navegação principal">
    <ul>
      <li><a href="campanha.html" aria-current="page">Campanhas</a></li>
      <li><a href="fichas.html">Fichas</a></li>
      <li><span class="nav-unavailable" aria-disabled="true" title="Em breve">Nosso RPG · Em breve</span></li>
    </ul>
    <div class="perfil" data-user-menu></div>
  </nav>

  <main>
    <header><h1>Minhas campanhas</h1><p>Crie e organize suas aventuras.</p></header>
    <section aria-labelledby="campaign-list-title">
      <h2 id="campaign-list-title">Campanhas cadastradas</h2>
      <div class="campanhas-container">
        <article class="campanha-card campanha-demonstrativa" id="campaign-example" hidden>
          <h3>Campanha 1</h3>
          <p>Descrição da campanha 1.</p>
          <footer class="campanha-acoes">Campanha de exemplo</footer>
        </article>
        <div id="campaign-list"></div>
        <button class="adicionar-campanha" type="button" aria-controls="new-campaign" aria-expanded="false">
          <span class="adicionar-icone" aria-hidden="true">+</span>
          <span>Adicionar<br>Campanha</span>
        </button>
      </div>
      <p id="campaign-message" role="status" aria-live="polite"></p>
    </section>
    <section id="new-campaign" aria-labelledby="new-campaign-title" hidden>
      <h2 id="new-campaign-title">Criar campanha</h2>
      <form id="campaign-form">
        <label for="campaign-name">Nome da campanha</label>
        <input id="campaign-name" name="name" maxlength="80" required>
        <label for="campaign-description">Descrição</label>
        <textarea id="campaign-description" name="description" maxlength="500"></textarea>
        <button type="submit">Criar campanha</button>
      </form>
    </section>
  </main>
</body>
</html>
