<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcana | Campanhas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/campanha.css">
  <script src="js/auth.js" defer></script>
  <script src="js/campanhas.js" defer></script>
    <script src="js/theme.js" defer></script>
</head>
<body>
  <nav aria-label="Navegação principal">
    <ul>
      <li><a href="campanha.html" aria-current="page">Campanhas</a></li>
      <li><a href="fichas.html">Fichas</a></li>
      <li><a href="#" aria-disabled="true" title="Em breve">Nosso RPG</a></li>
    </ul>
    <div class="perfil" data-user-menu></div>
  </nav>

  <main>
    <header><h1>Minhas campanhas</h1><p>Crie e organize suas aventuras.</p></header>
    <section aria-labelledby="new-campaign-title">
      <h2 id="new-campaign-title">Criar campanha</h2>
      <form id="campaign-form">
        <label for="campaign-name">Nome da campanha</label>
        <input id="campaign-name" name="name" maxlength="80" required>
        <label for="campaign-description">Descrição</label>
        <textarea id="campaign-description" name="description" maxlength="500"></textarea>
        <button type="submit">Criar campanha</button>
      </form>
      <p id="campaign-message" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="campaign-list-title">
      <h2 id="campaign-list-title">Campanhas cadastradas</h2>
      <div class="campanhas-container" id="campaign-list"></div>
    </section>
  </main>
</body>
</html>
