
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campanhas</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        /* NAVBAR */

        nav {
            background-color: #333;
            color: white;
            padding: 10px 25px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 75px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 10px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #aaa;
        }

        /* FOTO DE PERFIL */

        .perfil {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
        }

        .perfil a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .perfil img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        /* ÍCONE PADRÃO CASO NÃO TENHA FOTO */

        .perfil i {
            display: none;
            color: white;
            font-size: 45px;
            cursor: pointer;
        }

        /* CONTAINER DOS CARDS */

        .campanhas-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        /* CARDS */

        .campanha-card {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .campanha-card:hover {
            transform: translateY(-5px);
            box-shadow: 2px 5px 12px rgba(0,0,0,0.15);
        }

        .campanha-card h3 {
            margin-top: 0;
        }

        .campanha-card a {
            display: inline-block;
            margin-top: 10px;
            color: #007BFF;
            text-decoration: none;
        }

        .campanha-card a:hover {
            text-decoration: underline;
        }

        /* TABLETS */

        @media (max-width: 900px) {

            .campanhas-container {
                grid-template-columns: repeat(2, 1fr);
            }

            nav ul {
                gap: 20px;
            }

        }

        /* CELULARES */

        @media (max-width: 600px) {

            nav {
                padding: 15px 10px;
                min-height: 65px;
            }

            nav ul {
                gap: 5px;
                margin-right: 45px;
            }

            nav ul li a {
                padding: 5px;
                font-size: 13px;
            }

            .perfil {
                right: 10px;
            }

            .perfil img {
                width: 35px;
                height: 35px;
            }

            .perfil i {
                font-size: 35px;
            }

            .campanhas-container {
                grid-template-columns: 1fr;
                padding: 15px;
                gap: 15px;
            }

        }

        /* CELULARES PEQUENOS */

        @media (max-width: 380px) {

            nav ul {
                gap: 0;
            }

            nav ul li a {
                font-size: 11px;
                padding: 4px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <ul>
            <li><a href="">Campanhas</a></li>
            <li><a href="">Fichas</a></li>
            <li><a href="">Nosso sistema</a></li>
        </ul>

        <!-- FOTO DE PERFIL -->

        <div class="perfil">

            <a href="">

                <img
                    src="caminho/para/foto.jpg"
                    alt="Foto do Perfil"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                >

                <!-- Ícone exibido caso não exista foto -->

                <i class="bi bi-person-circle"></i>

            </a>

        </div>

    </nav>


    <!-- CAMPANHAS -->

    <div class="campanhas-container">

        <div class="campanha-card">
            <h3>Campanha 1</h3>
            <p>Descrição da campanha 1.</p>
            <a href="">Ver detalhes</a>
        </div>

        <div class="campanha-card">
            <h3>Campanha 2</h3>
            <p>Descrição da campanha 2.</p>
            <a href="">Ver detalhes</a>
        </div>

        <div class="campanha-card">
            <h3>Campanha 3</h3>
            <p>Descrição da campanha 3.</p>
            <a href="">Ver detalhes</a>
        </div>

    </div>

</body>

</html>
